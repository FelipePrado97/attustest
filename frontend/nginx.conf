server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API no mesmo domínio do front: sem CORS e sem URL de backend embutida no bundle.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: rotas do Angular (ex.: /processos/123) caem no index.html. Ele nunca vai para cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
